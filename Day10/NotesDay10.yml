Function :
---
Imagine opening small tea/coffee shops independently in different places.

No common branding
No shared standards
Each shop works independently
Sugar, coffee powder, setup may vary everywhere

This is like a function.

Independent behavior.

makeCoffee();
payBill();
takeOrder();

All are separate.

------------------------
Method
----

Now imagine opening cafes under one brand like Cafe Coffee Day CCD.

Everything is connected to the brand:

Same coffee powder
Same logo
Same process
Same menu
Easier to scale
More organized

This is like a method inside a class/object.

cafe.makeCoffee();
cafe.takeOrder();
cafe.payBill();

Now all actions belong to the cafe.

“properties like coffee powder, sugar are branded and related”

This maps perfectly to:

class CafeCoffeeDay {

   coffeePowder = "CCD-CoffeePowder";
   sugar = "CCD-Sugar";

   makeCCDCoffee() {
      console.log(this.coffeePowder);
   }
}

Here:

Properties → coffee powder, sugar
Methods → makeCoffee()

Everything stays related inside one object.

Scalability Point (Very Important)

With methods/classes:

✅ More organized
✅ Better readability
✅ Easier maintenance
✅ Easier scaling for large applications

That is exactly why frameworks like Playwright use methods:


| Function        | Method                   |
| --------------- | ------------------------ |
| Independent     | Attached to object/class |
| Called directly | Called using object      |
| `add()`         | `page.click()`           |
| General utility | Object behavior          |




AccessModifiers:
----------------

1. public : can be accessed inside and outside of the class
2. protected: can be accessed inside the class as well as the related class --> relationship--> inherit
3. private: not accessible outisde the class --> give permission to access or to rewrite "get" and "set"
4. readonly: constant/final --> cannot change the assigned value
5. static: belongs to the class and not to the object --> can be accessed without creating the object of the class.

🔹 When do we use static in a TypeScript framework?

We use static when the data or behavior is:

✅ Common for the entire framework
✅ Does NOT depend on object state
✅ Utility / helper / configuration
✅ Shared across tests, pages, or services

1️⃣ Static for Constants & Configuration
📌 Use case

URLs
Timeouts
Environment names
Browser types

class Config {
  static BASE_URL = "https://leaftaps.com";
  static TIMEOUT = 5000;
}

Usage (no object needed)
await page.goto(Config.BASE_URL);


✔ Single source of truth
✔ Easy to maintain

