********************************************************************************************************

Inheritance :

1. Single Inheritance :

classA{} 
classB extends A{}

Parent to Child

2. Multilevel Inheritance :

class A{}

class B extends A{}
class C extends B{}

Grandparent A -> parent B -> child C

3. Hierarchical inheritance 

class A{}

class B extends A{}
class C extends A{}

Parent having 2 children :

Parent Class A --> Class B
               --> Class C

4. Hybrid Inheritance

A combination of two or more types of inheritnace (e.x : multilevel and Hierarchical)


5. Multiple Inheritance
Typescript does not support multiple inheritnace using classes.
Can be achieved through interface.

*************************************************************************************************

Page Object Model :

POM means:

Each web page (or module) of your application is represented by a separate class,
and that class contains locators and methods that act on that page.

While desiging POM things to do:

1. Inheritance => mutilevel inheritance
2. Abstraction => playwright wrapper class
3. Data parameterization => json, env, faker(synthetic data)
4. Custom Fixture => Used to create ready made objects

Inheritance

abstract class -> loginPage --> welcomePage --> leadPage --> CreateLeadPage --> ViewLeadPage


faker library installation :

npm install @faker-js/faker@8.4.1

