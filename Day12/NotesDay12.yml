1. Interface :
-----------------

- Complete hiding of the implemented.
- 100% abstraction.
- Only unimplemented methods.

Summarize 

- class extends another class
- abstract extends another abstract class
- interface extends another interface
- class extends abstract class
- class implements interface
- class extends abstract class implemnets interface

(Note : In playwright we cannot see implementation of your page fixture, context browser in playwright everytging is put in as interface.)

2. Abstraction
----------------- 

abstract class :

- 0 to 100% abstraction.
- Method signature --> unimplementedmethods
- Implemented methods --> logic 


Polymorphism is the OOP principle that allows a single interface or method to have multiple implementations. 
In TypeScript, it is achieved through function overloading (compile-time polymorphism) and method overriding using inheritance (run-time polymorphism).

Overloading → Compile Time → Same method, different parameters
Overriding → Run Time → Child class override the parent method