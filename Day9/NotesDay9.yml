 TypeScript datatypes :
 ----------------------
  Difference between "any" and "unknown"
  --------------------------------------

 ✅ any — “Turn Off TypeScript”
let data: any = "Message received from the server";
data = 1234;
data = true;

data.toUpperCase();  // ✅ No error at compile time
data.push(10);       // ✅ No error
data();              // ✅ No error

🔴 Problem:

TypeScript does not check anything on any.
Even wrong operations compile successfully, and your app crashes at runtime.

So "any" means:

"I don't care about type safety."

✅ unknown — “Safe Version of any”
let value: unknown;

value = 40;
value = "Hello";

value.toUpperCase(); // ❌ ERROR (compile time)


TypeScript blocks you here because:

"I don't know what type this is yet."

Now we check:

if (typeof value === "string") {
    console.log(value.toUpperCase()); ✅ Allowed
}


✅ Now TypeScript knows it is a string.
✅ You proved the type — so it allows safe operations.

-----------------------------------------------------------

Real time example for "unknown"  datatype :

=> Reusable Utility Functions

Suppose you're building a common logger:

function logData(data: unknown) {

    if (typeof data === "string") {
        console.log(data.toUpperCase());
    }
}

If you use any, someone can pass:

logData(123);

And it crashes.

With unknown, framework forces validation.

function logData(data: any) {

    if (typeof data === "string") {
        console.log(data.toUpperCase());
    }else{
        console.log(data+"Different datatype");
        
    }
}

//If you use any, someone can pass:

logData(123);


//Tuple is typescript way handling array in JS :

let arrayVal : [string,number,boolean,string] = ["Playwright",2026,true,"AprilPW"]


/* With any

TypeScript trusts the developer completely.

So even unsafe code is allowed.

With unknown

TypeScript forces the developer to validate before usage.

So unsafe code is blocked at compile time.

This works safely because:

 YOU remembered to validate manually.

Important : But TypeScript did NOT force you to do it.

You could still accidentally write:

function logData(data: any) {
    console.log(data.toUpperCase());
}

And TS allows it.

But with unknown
function logData(data: unknown) {
    console.log(data.toUpperCase());
}

TypeScript immediately blocks it.

Compile error:

Object is of type 'unknown'

So with unknown:

 Validation is mandatory.

With any:

 Validation is optional.

any depends on developer discipline.

unknown enforces developer discipline.*/

