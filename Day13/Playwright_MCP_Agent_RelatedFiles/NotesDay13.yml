## 1. SOAP (Simple Object Access Protocol)

**Simple Definition**

> SOAP is a strict protocol that uses XML and follows predefined standards.

**Characteristics**

* Uses **XML**
* Highly secure (WS-Security)
* Strict rules
* Slower because XML is verbose

**Example**

```xml
<GetEmployeeRequest>
    <EmployeeId>101</EmployeeId>
</GetEmployeeRequest>
```

**Remember**

> SOAP = **Strict + Secure + XML**

---

## 2. REST (Representational State Transfer)

**Simple Definition**

> REST is the most commonly used API style. It uses HTTP methods and usually exchanges JSON data.

**HTTP Methods**

* GET
* POST
* PUT
* PATCH
* DELETE

**Example**

```http
GET /employees/101
```

Response

```json
{
  "id":101,
  "name":"John"
}
```

**Remember**

> REST = **Simple + JSON + HTTP**

---

## 3. GraphQL

**Simple Definition**

> GraphQL allows the client to request only the data it needs.

Instead of getting everything,

REST returns:

```json
{
 "id":101,
 "name":"John",
 "salary":50000,
 "address":"Chennai",
 "phone":"9999999999"
}
```

GraphQL Request

```graphql
{
 employee(id:101){
    name
    phone
 }
}
```

Response

```json
{
 "name":"John",
 "phone":"9999999999"
}
```

Only requested fields are returned.

**Remember**

> GraphQL = **Ask only what you need**

---

## 4. gRPC

**Simple Definition**

> gRPC is a high-performance communication framework developed by Google. It sends binary data instead of JSON, making it much faster.

Instead of JSON

```json
{
 "name":"John"
}
```

it sends

```
(Binary Protocol Buffer Data)
```

which computers process much faster.

**Remember**

> gRPC = **Fast + Binary + Microservices**

