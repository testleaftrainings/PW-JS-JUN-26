# One-Line Difference (Best for Interviews)

* **SOAP** → "A strict XML-based protocol with built-in enterprise features."
* **REST** → "A lightweight API style using HTTP and JSON."
* **GraphQL** → "An API query language where clients request exactly the data they need."
* **gRPC** → "A high-performance binary RPC framework designed for fast service-to-service communication."

